# The API has no build step (runs TypeScript directly via tsx), so it needs a
# full install including devDependencies. Force a full `npm install` (not `npm ci`)
# so a stale lockfile can't silently drop dependencies, and run the start command
# through `npx` so tsx resolves from node_modules/.bin without needing PATH.
[phases.install]
cmds = ["NODE_ENV=development npm install --no-audit --no-fund"]

[start]
cmd = "npx tsx apps/api/src/index.ts"
